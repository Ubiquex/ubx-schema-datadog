name: publish

# Manual-trigger only (matching every ubx-sdk-* repo's own publish.yml
# convention, and ubx-schema-kubernetes's own identical real workflow):
# after a hash-watch regen PR merges, someone clicks "Run workflow" to
# cut the real GitHub Release provider.AcquireSchema (ubiquex's own
# provider/acquireschema.go) expects -- tag v<version>, exactly two
# assets, snapshot.tar.gz and SHA256SUMS.
#
# The COMMITTED files stay separate, per-member (manifest.json +
# members/<name>.json) -- that's what makes a version bump's own real
# git diff show which members actually changed. The RELEASE packs them
# into ONE compressed archive purely so a real pinned resolution stays
# one real download regardless of member count (this repo's own real
# 4-member group is a smaller real proof of the same problem AWS's real
# 430-member group has at much larger scale).
#
# The version published is always whatever's already committed in
# manifest.json -- this workflow never bumps a version itself;
# hash-watch.yml already derives and commits the real, mechanical
# version bump before this ever runs.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-schema-datadog
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read the version to publish from the committed manifest
        id: version
        run: |
          set -euo pipefail
          v="$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing manifest.json's own committed version: $v"

      - name: Refuse to republish an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released -- nothing to do (a real hash-watch regen bumps manifest.json's own version before this can run again)" >&2
            exit 1
          fi

      - name: Pack the committed group into one real archive
        run: |
          set -euo pipefail
          tar czf snapshot.tar.gz manifest.json members/
          sha256sum snapshot.tar.gz > SHA256SUMS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          fmt="$(python3 -c "import json; print(json.load(open('manifest.json'))['schema_format'])")"
          members="$(python3 -c "import json; print(', '.join(json.load(open('manifest.json'))['members']))")"
          gh release create "v$v" snapshot.tar.gz SHA256SUMS \
            --title "v$v" \
            --notes "Datadog provider schema snapshot v$v (schema_format $fmt, real members: $members).

          Pin each real member you need in ubiquex -- all four point at the same repo/version, one real download covers all of them:

          \`\`\`toml
          [providers.datadog]
          source  = \"ubiquex/datadog\"
          version = \"$v\"

          [providers.datadog_v2]
          source  = \"ubiquex/datadog\"
          version = \"$v\"

          [providers.datadog_ds]
          source  = \"ubiquex/datadog\"
          version = \"$v\"

          [providers.datadog_v2_ds]
          source  = \"ubiquex/datadog\"
          version = \"$v\"
          \`\`\`"

      - name: Verify the release is real and carries exactly the two expected assets, queried independently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          gh release view "v$v" --json assets --jq '.assets[].name' | sort > "${{ runner.temp }}/got-assets"
          printf '%s\n' "SHA256SUMS" "snapshot.tar.gz" | sort > "${{ runner.temp }}/want-assets"
          if ! diff -u "${{ runner.temp }}/want-assets" "${{ runner.temp }}/got-assets"; then
            echo "release v$v does not have exactly the two expected assets" >&2
            exit 1
          fi
          echo "v$v published with exactly the two expected assets."
